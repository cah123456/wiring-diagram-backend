# ============================================================================
# GRIDLINE 后端运行配置（简化版）
#
# 技术栈：Spring Boot 3.5 + MyBatis-Plus 3.5 + Lombok + MySQL 8。
# 数据库已切换为 gridline_wiring，旧的 switchgear_wiring 不受影响。
# 所有敏感项均支持环境变量覆盖，生产环境不要使用默认的 root/root。
# ============================================================================
server:
  # HTTP 监听端口；前端 Vite 开发服务器将 /api 代理到这里。
  port: 8080
  # 优雅停机：收到 SIGTERM 后先停止接收新请求，等待处理中的请求完成。
  shutdown: graceful

spring:
  application:
    name: wiring-diagram

  datasource:
    # createDatabaseIfNotExist=true 仅用于开发环境首次启动自动建库；
    # 随后 spring.sql.init 会执行 db/schema.sql 建表（IF NOT EXISTS，可重复执行）。
    url: ${DB_URL:jdbc:mysql://localhost:3306/gridline_wiring?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      # 单实例、低并发场景，连接数不宜过高。
      maximum-pool-size: 10
      minimum-idle: 2

  sql:
    init:
      # 不引入 Flyway，改用一份幂等的 schema.sql 初始化表结构。
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

  jackson:
    # 响应中省略 null 字段，减少 payload；前端对可选字段做了空值兼容。
    default-property-inclusion: non_null
    serialization:
      # LocalDateTime 输出 ISO-8601 字符串，而不是时间戳数字。
      write-dates-as-timestamps: false

  web:
    resources:
      # 纯 API 服务，不提供静态资源；未知路径统一由全局异常处理器返回 404 R。
      add-mappings: false

mybatis-plus:
  configuration:
    # 数据库 snake_case 列自动映射到 Java camelCase 属性。
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 与 @TableId(type = IdType.AUTO) 保持一致，使用 MySQL 自增主键。
      id-type: auto

app:
  cors:
    # 允许的来源，逗号分隔；默认放行本机及常见私网网段，便于局域网访问。
    # 生产环境建议通过 CORS_ALLOWED_ORIGIN_PATTERNS 收紧为具体域名。
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.*:*}

logging:
  level:
    # 业务包输出 INFO；需要排查 SQL 时把 mapper 包临时调成 DEBUG。
    com.gridline.wiring: INFO
    com.gridline.wiring.mapper: INFO
